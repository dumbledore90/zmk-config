# oyayubi_01 ビルドマトリクス
#
# 左手 (central):
#   - ZMK Studio を有効化 (snippet + cmake-args)
#   - Studio は central 側にのみ有効にする。peripheral は BLE 経由でキーイベントを
#     転送するだけなので Studio の RPC バスが不要 (ZMK ドキュメント参照)
#
# 右手 (peripheral):
#   - Studio なし
#   - エンコーダは overlay で定義済み。EC11 の Kconfig は Kconfig.defconfig で有効化
---
include:
  - board: seeeduino_xiao_ble
    shield: oyayubi_01_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: oyayubi_01_left

  - board: seeeduino_xiao_ble
    shield: oyayubi_01_right
    artifact-name: oyayubi_01_right
