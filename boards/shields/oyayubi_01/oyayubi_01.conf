# oyayubi_01 推奨設定
# このファイルはユーザーの config/ にコピーされる

# ── BLE ───────────────────────────────────────────────────────────────
# 接続安定性向上 (ZMK 推奨の実験的フラグ)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# TX 出力を最大にして接続距離・安定性を改善
# 電池消費が若干増えるが BLE 距離優先
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── バッテリー ─────────────────────────────────────────────────────────
# OS へのバッテリー残量通知 (nRF52840 内蔵 ADC 使用)
CONFIG_ZMK_BATTERY_REPORTING=y

# ── 省電力スリープ ────────────────────────────────────────────────────
# アイドル後にディープスリープへ移行 (スライドスイッチでも同等の節電になるが念のため)
CONFIG_ZMK_SLEEP=y
# スリープ開始まで 15 分 (ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ── スプリット ────────────────────────────────────────────────────────
# central (左手) が peripheral (右手) のバッテリー残量を OS に中継する
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ── エンコーダ ────────────────────────────────────────────────────────
# EC11 を有効化 (右手 overlay に alps,ec11 ノードがあるため必要)
# Kconfig.defconfig で SHIELD_OYAYUBI_01_RIGHT 時に自動 y になるが、
# 明示的に残しておくとユーザーが確認しやすい
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ── ディスプレイ (未実装) ──────────────────────────────────────────────
# CONFIG_ZMK_DISPLAY=y
